# ===============================
# = Configuracoes do Servidor =
# ===============================
server.port=8080

# ===============================
# = Configuracao do Banco de Dados =
# ===============================
# When running the app locally (not inside Docker) use localhost and the database name `easyapi`.
# Add `?sslmode=disable` to avoid SSL negotiation EOF errors when the server isn't using SSL.
spring.datasource.url=jdbc:postgresql://localhost:5432/easyapi?sslmode=disable
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# If you run the application inside the Docker `app` service, the DB host should be `postgres-db` (service name):
# Example (overridden by environment in docker-compose):
# spring.datasource.url=jdbc:postgresql://postgres-db:5432/easyapi?sslmode=disable

# ===============================
# = Configuracoes JPA / Hibernate =
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# = Configuracoes de Log (opcional) =
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
